<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rustium</title>
<style>
  :root {
    --strip: #202124; --tab: #35363a; --tab-hover: #2a2b2e; --bar: #35363a; --omni: #202124;
    --text: #e8eaed; --dim: #9aa0a6; --accent: #8ab4f8; --game: #81c995; --danger: #f28b82;
    --panel: #292a2d; --line: #3c4043;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--strip); color: var(--text); font: 13px "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden; height: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--text); background: var(--omni); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }

  #chrome { position: absolute; left: 0; right: 0; top: 0; }
  /* tab strip */
  #strip { display: flex; align-items: flex-end; height: 36px; padding: 0 8px; gap: 2px; }
  #tabs { display: flex; flex: 1; min-width: 0; gap: 1px; height: 30px; }
  .tab { flex: 0 1 220px; min-width: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px;
    border-radius: 8px 8px 0 0; cursor: default; position: relative; color: var(--dim); }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab); color: var(--text); }
  .tab.sleeping .ico, .tab.sleeping .ttl { opacity: .45; }
  .tab .ico { width: 16px; height: 16px; flex: none; border-radius: 3px; display: grid; place-items: center;
    font-size: 10px; font-weight: 600; background: #5f6368; color: #fff; overflow: hidden; }
  .tab .ico img { width: 16px; height: 16px; }
  .tab .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .badge { font-size: 11px; }
  .tab .x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; line-height: 1; }
  .tab .x:hover { background: #4a4c50; }
  .tab.loading .ico { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #newtab { width: 28px; height: 28px; border-radius: 50%; font-size: 18px; margin-bottom: 1px; }
  #newtab:hover { background: var(--tab-hover); }

  /* toolbar */
  #bar { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; background: var(--bar); }
  .ib { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; flex: none; }
  .ib:hover:not(:disabled) { background: #4a4c50; }
  .ib:disabled { opacity: .35; cursor: default; }
  #omni { flex: 1; height: 30px; border-radius: 15px; padding: 0 14px; border: 0; background: var(--omni); }
  #omni:focus { box-shadow: 0 0 0 2px var(--accent); }
  #star.on { color: var(--accent); }
  #game { width: auto; padding: 0 10px; border-radius: 15px; gap: 6px; display: flex; align-items: center; font-size: 12px; height: 28px; }
  #game.on { background: rgba(129,201,149,.18); color: var(--game); }
  #mem { color: var(--dim); font-size: 11px; min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

  /* infobar (password save prompt, notices) */
  #info { display: none; align-items: center; gap: 10px; height: 40px; padding: 0 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  #info.show { display: flex; }
  #info .msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--line); }
  .btn:hover { background: #3c4043; }
  .btn.primary { background: var(--accent); color: #202124; border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }

  /* full-window panel */
  #panel { position: absolute; inset: 0; display: none; background: var(--panel); user-select: text; }
  #panel.show { display: flex; }
  #nav { width: 220px; padding: 16px 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  #nav h1 { font-size: 18px; margin: 4px 12px 16px; font-weight: 600; }
  #nav h1 span { color: #f74c00; }
  #nav button { text-align: left; padding: 10px 14px; border-radius: 0 20px 20px 0; font-size: 14px; }
  #nav button.sel { background: rgba(138,180,248,.16); color: var(--accent); }
  #nav .spacer { flex: 1; }
  #main { flex: 1; overflow: auto; padding: 24px 40px; }
  #main h2 { font-weight: 500; font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .row:hover { background: rgba(255,255,255,.03); }
  .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--dim); font-size: 12px; }
  .row a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .tools { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .tools input[type=search] { flex: 1; min-width: 200px; }
  .card { background: #202124; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .card p { margin: 0 0 10px; color: var(--dim); line-height: 1.5; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field label { flex: 1; } .field small { display: block; color: var(--dim); }
  .pw { font-family: Consolas, monospace; min-width: 140px; }
  .empty { color: var(--dim); padding: 30px 8px; }
  #toast { position: absolute; right: 12px; top: 84px; background: #3c4043; padding: 10px 16px; border-radius: 8px;
    display: none; max-width: 60%; box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 5; }
  #toast.show { display: block; }
  kbd { background: #3c4043; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #5f6368; border-radius: 10px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); }
  body.game * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="chrome">
  <div id="strip">
    <div id="tabs"></div>
    <button id="newtab" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="bar">
    <button class="ib" id="back" title="Back (Alt+Left)">&#x2190;</button>
    <button class="ib" id="fwd" title="Forward (Alt+Right)">&#x2192;</button>
    <button class="ib" id="reload" title="Reload (F5)">&#x21bb;</button>
    <button class="ib" id="home" title="Home (Alt+Home)">&#x2302;</button>
    <input id="omni" list="sugg" spellcheck="false" autocomplete="off" placeholder="Search Google or type a URL">
    <datalist id="sugg"></datalist>
    <button class="ib" id="star" title="Bookmark this tab (Ctrl+D)">&#x2606;</button>
    <button class="ib" id="keys" title="Passwords">&#x1F511;</button>
    <button class="ib" id="game" title="Game mode (Ctrl+Shift+G): sleeps background tabs and gives your game the CPU when the browser isn't focused">&#x1F3AE;<span>Game</span></button>
    <span id="mem" title="RAM used by the browser and all its engine processes"></span>
    <button class="ib" id="menu" title="Settings and more">&#x22EE;</button>
  </div>
  <div id="info"><span class="msg"></span><span class="acts"></span></div>
</div>

<div id="panel">
  <div id="nav">
    <h1><span>&#x2699;</span> Rustium</h1>
    <button data-p="passwords">&#x1F511;&nbsp; Passwords</button>
    <button data-p="bookmarks">&#x2606;&nbsp; Bookmarks</button>
    <button data-p="history">&#x1F552;&nbsp; History</button>
    <button data-p="downloads">&#x2B07;&nbsp; Downloads</button>
    <button data-p="performance">&#x1F3AE;&nbsp; Performance</button>
    <button data-p="settings">&#x2699;&nbsp; Settings</button>
    <div class="spacer"></div>
    <button id="closepanel">&#x2715;&nbsp; Close <kbd>Esc</kbd></button>
  </div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<input type="file" id="csvfile" accept=".csv,text/csv" style="display:none">

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const send = (cmd, data = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...data }));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const host = (u) => { try { return new URL(u).host; } catch (_) { return u; } };
  const mb = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + ' GB' : Math.round(b / (1 << 20)) + ' MB';

  let S = { tabs: [] }, panel = null, data = {}, omniEditing = false;

  // ---------------- tab strip & toolbar ----------------
  function favicon(t) {
    let origin = '';
    try { const u = new URL(t.url); if (u.protocol.startsWith('http')) origin = u.origin; } catch (_) {}
    const letter = esc((t.title || host(t.url) || '?').trim().charAt(0).toUpperCase());
    if (!origin || t.loading) return `<span class="ico">${t.loading ? '&#x25CC;' : letter}</span>`;
    return `<span class="ico"><img src="${esc(origin)}/favicon.ico" onerror="this.replaceWith(document.createTextNode('${letter}'))"></span>`;
  }
  function renderTabs() {
    $('#tabs').innerHTML = S.tabs.map((t) => `
      <div class="tab ${t.active ? 'active' : ''} ${t.sleeping ? 'sleeping' : ''} ${t.loading ? 'loading' : ''}" data-id="${t.id}"
           title="${esc(t.title)}\n${esc(t.url)}${t.sleeping ? '\n(sleeping — using no memory)' : t.frozen ? '\n(frozen — paused in background)' : ''}">
        ${favicon(t)}
        <span class="ttl">${esc(t.title || host(t.url) || 'New Tab')}</span>
        ${t.playing ? '<span class="badge">&#x1F50A;</span>' : t.sleeping ? '<span class="badge">&#x1F4A4;</span>' : ''}
        <button class="x" data-close="${t.id}" title="Close tab (Ctrl+W)">&times;</button>
      </div>`).join('');
  }
  function renderBar() {
    $('#back').disabled = !S.canBack;
    $('#fwd').disabled = !S.canForward;
    $('#star').classList.toggle('on', !!S.bookmarked);
    $('#star').innerHTML = S.bookmarked ? '&#x2605;' : '&#x2606;';
    $('#game').classList.toggle('on', !!S.game);
    document.body.classList.toggle('game', !!S.game);
    $('#mem').textContent = S.mem ? mb(S.mem) : '';
    if (!omniEditing) $('#omni').value = S.url || '';
  }

  $('#tabs').addEventListener('mousedown', (e) => {
    const close = e.target.closest('[data-close]');
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const id = +tab.dataset.id;
    if (close || e.button === 1) { e.preventDefault(); send('close', { id }); }
    else if (e.button === 0) send('activate', { id });
  });
  $('#strip').addEventListener('dblclick', (e) => { if (!e.target.closest('.tab')) send('newtab'); });
  $('#newtab').onclick = () => send('newtab');
  $('#back').onclick = () => send('back');
  $('#fwd').onclick = () => send('forward');
  $('#reload').onclick = () => send('reload');
  $('#home').onclick = () => send('home');
  $('#star').onclick = () => send('bookmark_toggle');
  $('#game').onclick = () => send('game_mode', { on: !S.game });
  $('#keys').onclick = () => openPanel('passwords');
  $('#menu').onclick = () => openPanel('settings');

  const omni = $('#omni');
  omni.addEventListener('focus', () => { omniEditing = true; setTimeout(() => omni.select(), 0); });
  omni.addEventListener('blur', () => { omniEditing = false; omni.value = S.url || ''; });
  let sugTimer = 0;
  omni.addEventListener('input', () => {
    clearTimeout(sugTimer);
    sugTimer = setTimeout(() => send('suggest', { q: omni.value }), 120);
  });
  omni.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { send('navigate', { text: omni.value }); omniEditing = false; omni.blur(); }
    if (e.key === 'Escape') { omni.value = S.url || ''; omni.blur(); send('focus_page'); }
  });

  // Same shortcuts as in web pages, for when the toolbar has focus.
  addEventListener('keydown', (e) => {
    const c = e.ctrlKey || e.metaKey, k = e.key, l = k.length === 1 ? k.toLowerCase() : k;
    let a = null;
    if (k === 'Escape' && panel) { closePanel(); e.preventDefault(); return; }
    if (c && e.shiftKey && l === 't') a = 'reopen';
    else if (c && e.shiftKey && l === 'g') a = 'gamemode';
    else if (c && !e.shiftKey && l === 't') a = 'newtab';
    else if (c && l === 'w') a = 'close';
    else if (c && l === 'l' || k === 'F6') { omni.focus(); e.preventDefault(); return; }
    else if (c && k === 'Tab') a = e.shiftKey ? 'prev' : 'next';
    else if (c && /^[1-9]$/.test(k)) a = 'tab' + k;
    else if (c && l === 'h') { openPanel('history'); e.preventDefault(); return; }
    else if (c && l === 'j') { openPanel('downloads'); e.preventDefault(); return; }
    else if (k === 'F5') a = 'reload';
    if (a) { e.preventDefault(); send('key', { k: a }); }
  });

  // Tell the native side how tall the toolbar area is, so pages are laid out below it.
  new ResizeObserver(() => { if (!panel) send('height', { h: Math.ceil($('#chrome').getBoundingClientRect().height) }); }).observe($('#chrome'));

  // ---------------- infobar & toast ----------------
  function info(msg, actions) {
    const el = $('#info');
    if (!msg) { el.classList.remove('show'); return; }
    el.querySelector('.msg').innerHTML = msg;
    el.querySelector('.acts').innerHTML = actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join(' ');
    el.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { info(null); savePending = false; actions[+b.dataset.i].fn(); });
    el.classList.add('show');
  }
  let toastTimer = 0;
  function toast(msg, ms = 4000) {
    const t = $('#toast');
    t.innerHTML = msg; if (panel) t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove('show'); if (infoIsToast) info(null); }, ms);
    // Outside the panel the toolbar is too short for a floating toast, so use the infobar —
    // unless a save-password question is showing, which must not be replaced.
    if (!panel && !savePending) { info(msg, [{ label: 'OK', fn() {} }]); infoIsToast = true; }
  }
  let infoIsToast = false, savePending = false;

  // ---------------- panels ----------------
  function openPanel(p) {
    panel = p;
    $('#panel').classList.add('show');
    document.querySelectorAll('#nav [data-p]').forEach((b) => b.classList.toggle('sel', b.dataset.p === p));
    send('panel', { open: true });
    load(p);
  }
  function closePanel() {
    panel = null;
    $('#panel').classList.remove('show');
    send('panel', { open: false });
    send('height', { h: Math.ceil($('#chrome').getBoundingClientRect().height) });
  }
  document.querySelectorAll('#nav [data-p]').forEach((b) => b.onclick = () => openPanel(b.dataset.p));
  $('#closepanel').onclick = closePanel;

  function load(p) {
    ({ passwords: () => send('pw_list'), bookmarks: () => send('bm_list'), history: () => send('hist_list'),
       downloads: () => render(), performance: () => send('perf'), settings: () => send('settings_get') }[p])();
    render();
  }

  const views = {
    passwords() {
      const q = (data.pwq || '').toLowerCase();
      const list = (data.passwords || []).filter((c) => !q || c.origin.toLowerCase().includes(q) || c.username.toLowerCase().includes(q));
      return `<h2>Password Manager</h2>
        <div class="card"><h3>Bring your Chrome passwords</h3>
          <p>1. In Chrome open <b>chrome://password-manager/settings</b> &rarr; <b>Export passwords</b> &rarr; save the .csv file.<br>
          2. Click <b>Import CSV</b> below and pick that file. Works with Edge, Brave, Firefox and Bitwarden exports too.<br>
          3. <b>Delete the .csv afterwards</b> — it contains your passwords in plain text.</p>
          <div class="tools" style="margin:0"><button class="btn primary" id="pwimport">Import CSV</button>
          <button class="btn" id="pwexport">Export CSV</button>
          <span class="sub">${data.passwords ? data.passwords.length + ' saved' : ''} · encrypted on disk${data.dpapi ? ' with your Windows account (DPAPI)' : ''}</span></div>
        </div>
        <div class="tools"><input type="search" id="pwq" placeholder="Search passwords" value="${esc(data.pwq || '')}"></div>
        ${list.length ? list.map((c) => `<div class="row">
            <span class="grow"><div>${esc(host(c.origin))}</div><div class="sub">${esc(c.origin)}</div></span>
            <span class="grow">${esc(c.username) || '<span class="sub">(no username)</span>'}</span>
            <span class="pw" id="pw${c.id}">${data.revealed && data.revealed[c.id] != null ? esc(data.revealed[c.id]) : '&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;'}</span>
            <button class="btn" data-reveal="${c.id}">${data.revealed && data.revealed[c.id] != null ? 'Hide' : 'Show'}</button>
            <button class="btn" data-copy="${c.id}">Copy</button>
            <button class="btn danger" data-del="${c.id}">Delete</button></div>`).join('')
          : `<div class="empty">${q ? 'No matches.' : 'No saved passwords yet. Import from Chrome above, or just log in to sites — Rustium will offer to save.'}</div>`}`;
    },
    bookmarks() {
      const list = data.bookmarks || [];
      return `<h2>Bookmarks</h2>
        <div class="tools"><button class="btn primary" id="bmimport">Import from Chrome</button>
          <span class="sub">Reads bookmarks from every Chrome / Edge / Brave profile on this PC.</span></div>
        ${list.length ? list.map((b, i) => `<div class="row">
            <span class="grow"><a data-open="${esc(b.url)}">${esc(b.title)}</a><div class="sub">${esc(b.folder ? b.folder + ' · ' : '')}${esc(b.url)}</div></span>
            <button class="btn danger" data-bmdel="${i}">Delete</button></div>`).join('')
          : '<div class="empty">No bookmarks yet. Press <kbd>Ctrl+D</kbd> on any page, or import from Chrome.</div>'}`;
    },
    history() {
      const list = data.history || [];
      return `<h2>History</h2>
        <div class="tools"><input type="search" id="hq" placeholder="Search history" value="${esc(data.hq || '')}">
          <button class="btn danger" id="hclear">Clear all history</button></div>
        ${list.length ? list.map((h) => `<div class="row">
            <span class="sub" style="width:120px">${new Date(h.last_visit * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
            <span class="grow"><a data-open="${esc(h.url)}">${esc(h.title || h.url)}</a><div class="sub">${esc(h.url)}</div></span></div>`).join('')
          : '<div class="empty">Nothing here.</div>'}`;
    },
    downloads() {
      const list = (S.downloads || []).slice().reverse();
      return `<h2>Downloads</h2>
        ${list.length ? list.map((d) => `<div class="row">
            <span class="grow"><div>${esc(d.name)}</div><div class="sub">${d.done ? (d.ok ? esc(d.path) : 'Failed') : 'Downloading…'}</div></span>
            ${d.done && d.ok ? `<button class="btn" data-show="${esc(d.path)}">Show in folder</button>` : ''}</div>`).join('')
          : '<div class="empty">No downloads this session.</div>'}`;
    },
    performance() {
      const p = data.perf || {};
      return `<h2>Performance</h2>
        <div class="card"><h3>Memory: ${p.mem ? mb(p.mem) : '…'}</h3>
          <p>${p.awake ?? '…'} of ${p.total ?? '…'} tabs are loaded. Background tabs are frozen after a minute and fully unloaded
          after a while (they reload instantly when you click them). Tabs playing audio are never put to sleep.</p>
          <div class="tools" style="margin:0"><button class="btn primary" id="sleepall">Sleep all background tabs now</button></div></div>
        <div class="card"><h3>&#x1F3AE; Game mode ${S.game ? '<span style="color:var(--game)">ON</span>' : 'off'}</h3>
          <p>While you're in a game (browser not focused): every browser process drops to below-normal CPU priority and Windows
          Efficiency Mode, background tabs are frozen immediately and unloaded after 3 minutes, and at most 3 tabs stay loaded.
          Music / video keeps playing. Toggle with <kbd>Ctrl+Shift+G</kbd>.</p>
          <div class="tools" style="margin:0"><button class="btn ${S.game ? '' : 'primary'}" id="gametoggle">${S.game ? 'Turn off' : 'Turn on'}</button></div></div>
        <div class="card"><h3>Engine</h3><p>${esc(p.engine || '')}</p></div>`;
    },
    settings() {
      const s = data.settings; if (!s) return '<h2>Settings</h2>';
      const engines = [['Google', 'https://www.google.com/search?q={}'], ['Bing', 'https://www.bing.com/search?q={}'],
        ['DuckDuckGo', 'https://duckduckgo.com/?q={}'], ['Brave Search', 'https://search.brave.com/search?q={}'], ['Startpage', 'https://www.startpage.com/do/search?q={}']];
      const sw = (k) => `<label class="switch"><input type="checkbox" data-set="${k}" ${s[k] ? 'checked' : ''}><span></span></label>`;
      const num = (k, min, max) => `<input type="number" data-set="${k}" value="${s[k]}" min="${min}" max="${max}" style="width:90px">`;
      return `<h2>Settings</h2>
        <div class="card">
          <div class="field"><label>Home page / new tab page</label><input data-set="homepage" value="${esc(s.homepage)}" style="width:320px"></div>
          <div class="field"><label>Search engine</label><select data-set="search_engine">${engines.map(([n, u]) => `<option value="${u}" ${s.search_engine === u ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div class="field"><label>Continue where you left off<small>Reopen your tabs on startup</small></label>${sw('restore_session')}</div>
          <div class="field"><label>Offer to save passwords</label>${sw('offer_save_passwords')}</div>
        </div>
        <div class="card"><h3>Memory &amp; performance</h3>
          <div class="field"><label>Freeze background tabs after (seconds)</label>${num('freeze_after_sec', 5, 3600)}</div>
          <div class="field"><label>Unload background tabs after (minutes)</label>${num('sleep_after_min', 1, 1440)}</div>
          <div class="field"><label>Max loaded tabs<small>Least recently used tabs are unloaded beyond this</small></label>${num('max_awake_tabs', 1, 100)}</div>
          <div class="field"><label>Max renderer processes<small>Lower = less RAM, more sharing between sites. Restart to apply.</small></label>${num('renderer_process_limit', 2, 32)}</div>
          <div class="field"><label>GPU boost<small>Force GPU rasterization &amp; zero-copy. Restart to apply.</small></label>${sw('gpu_boost')}</div>
          <div class="field"><label>Game mode</label>${sw('game_mode')}</div>
        </div>
        <div class="card"><h3>Privacy</h3>
          <div class="tools" style="margin:0"><button class="btn danger" id="cleardata">Clear cookies, cache &amp; site data</button>
          <button class="btn danger" id="hclear2">Clear history</button></div></div>
        <div class="card"><h3>About</h3><p>Rustium ${esc(data.version || '')} — browser written in Rust, rendering with the Chromium engine (${esc(data.engine || '')}).<br>
          Profile folder: ${esc(data.data_dir || '')}<br>
          Extensions: drop unpacked Chrome extensions into <b>${esc(data.ext_dir || '')}</b> and restart.</p></div>`;
    },
  };
  function render() {
    if (!panel) return;
    const main = $('#main');
    const focusId = document.activeElement && main.contains(document.activeElement) ? document.activeElement.id : null;
    main.innerHTML = views[panel]();
    if (focusId && $('#' + focusId)) { const el = $('#' + focusId); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
    bind();
  }
  function bind() {
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on('#pwimport', () => $('#csvfile').click());
    on('#pwexport', () => { if (confirm('Export all passwords to a plain-text CSV in your Downloads folder?')) send('pw_export'); });
    on('#bmimport', () => send('bm_import_chrome'));
    on('#hclear', () => { if (confirm('Clear all browsing history?')) send('hist_clear'); });
    on('#hclear2', () => { if (confirm('Clear all browsing history?')) send('hist_clear'); });
    on('#cleardata', () => { if (confirm('Sign out of all sites and clear cookies, cache and site data?')) send('clear_data'); });
    on('#sleepall', () => send('sleep_all'));
    on('#gametoggle', () => send('game_mode', { on: !S.game }));
    const pwq = $('#pwq'); if (pwq) pwq.oninput = () => { data.pwq = pwq.value; render(); };
    let ht = 0; const hq = $('#hq'); if (hq) hq.oninput = () => { data.hq = hq.value; clearTimeout(ht); ht = setTimeout(() => send('hist_list', { q: hq.value }), 150); };
    document.querySelectorAll('[data-reveal]').forEach((b) => b.onclick = () => {
      const id = +b.dataset.reveal; data.revealed = data.revealed || {};
      if (data.revealed[id] != null) { delete data.revealed[id]; render(); } else send('pw_reveal', { id });
    });
    document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => send('pw_reveal', { id: +b.dataset.copy, copy: true }));
    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { if (confirm('Delete this saved password?')) send('pw_delete', { id: +b.dataset.del }); });
    document.querySelectorAll('[data-bmdel]').forEach((b) => b.onclick = () => send('bm_delete', { i: +b.dataset.bmdel }));
    document.querySelectorAll('[data-open]').forEach((a) => a.onclick = () => { send('open_url', { url: a.dataset.open }); closePanel(); });
    document.querySelectorAll('[data-show]').forEach((b) => b.onclick = () => send('show_file', { path: b.dataset.show }));
    document.querySelectorAll('[data-set]').forEach((el) => el.onchange = () => {
      const k = el.dataset.set, s = data.settings;
      s[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(+el.min, Math.min(+el.max, +el.value || 0)) : el.value;
      send('settings_set', { settings: s });
    });
  }
  $('#csvfile').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 20 << 20) { toast('That file is too large to be a password export.'); return; }
    send('pw_import_csv', { csv: await f.text(), name: f.name });
  };

  function copyText(t) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }

  // ---------------- API used by the Rust side ----------------
  window.R = {
    state(s) { S = s; renderTabs(); renderBar(); if (panel === 'downloads' || panel === 'performance') render(); },
    reply(kind, d) {
      if (kind === 'password') {
        if (d.copy) { copyText(d.password); toast('Password copied'); return; }
        data.revealed = data.revealed || {}; data.revealed[d.id] = d.password;
      } else if (kind === 'suggest') {
        $('#sugg').innerHTML = d.map(([u, t]) => `<option value="${esc(u)}">${esc(t)}</option>`).join('');
        return;
      } else if (kind === 'passwords') { data.passwords = d.list; data.dpapi = d.dpapi; }
      else if (kind === 'settings') { data.settings = d.settings; data.version = d.version; data.engine = d.engine; data.data_dir = d.data_dir; data.ext_dir = d.ext_dir; }
      else data[kind] = d;
      render();
    },
    toast,
    savePrompt(p) {
      infoIsToast = false; savePending = !!p;
      if (!p) { info(null); return; }
      const what = p.update ? 'Update saved password' : 'Save password';
      info(`&#x1F511; ${what} for <b>${esc(p.username || '(no username)')}</b> on <b>${esc(host(p.origin))}</b>?`, [
        { label: p.update ? 'Update' : 'Save', cls: 'primary', fn: () => send('pw_save_answer', { answer: 'save' }) },
        { label: 'Never for this site', fn: () => send('pw_save_answer', { answer: 'never' }) },
        { label: 'Not now', fn: () => send('pw_save_answer', { answer: 'no' }) },
      ]);
    },
    focusOmni() { omni.focus(); },
    openPanel,
  };
  send('ready');
})();
</script>
</body>
</html>
